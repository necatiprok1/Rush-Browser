                background-color: #e9ecef;
                border-bottom-color: #dee2e6;
            }
            
            :root.light-mode .dev-tab.active {
                background-color: #007bff;
                color: white;
            }
            
            :root.light-mode .console-output {
                background-color: white;
            }
            
            :root.light-mode .console-log {
                border-bottom-color: rgba(0, 0, 0, 0.05);
            }
        </style>

        <script>
            // Browser functionality
            let currentZoomFactor = 1.0;
            let isLightMode = false;
            let bookmarks = [];
            let tabs = [];
            let nextTabId = 1;

            function newTab(url) {
                const defaultUrl =
                    "file://" +
                    window.location.pathname.replace(
                        "index.html",
                        "search.html",
                    );
                window.electronAPI.newTab(url || defaultUrl);
            }

            function switchToTab(tabId) {
                window.electronAPI.switchTab(tabId);
            }

            function closeTab(tabId, event) {
                if (event) {
                    event.stopPropagation();
                }
                window.electronAPI.closeTab(tabId);
            }

            // Optimized tab rendering with animations
            let isRenderingTabs = false;
            let pendingTabUpdate = null;

            function renderTabs() {
                // Debounce rapid updates
                if (isRenderingTabs) {
                    pendingTabUpdate = true;
                    return;
                }

                isRenderingTabs = true;
                const tabsContainer = document.querySelector(".tabs");
                
                // Get current tabs for comparison
                const existingTabs = Array.from(tabsContainer.children);
                const existingTabIds = existingTabs.map(tab => parseInt(tab.dataset.tabId || 0));
                const newTabIds = tabs.map(tab => tab.id);

                // Find tabs to remove
                const tabsToRemove = existingTabs.filter(tab => {
                    const tabId = parseInt(tab.dataset.tabId || 0);
                    return !newTabIds.includes(tabId);
                });

                // Find tabs to add
                const tabsToAdd = tabs.filter(tab => !existingTabIds.includes(tab.id));

                // Animate removed tabs
                tabsToRemove.forEach(tabElement => {
                    tabElement.classList.add('tab-leaving');
                    setTimeout(() => {
                        if (tabElement.parentNode) {
                            tabElement.parentNode.removeChild(tabElement);
                        }
                    }, 250);
                });

                // Update existing tabs
                existingTabs.forEach(tabElement => {
                    const tabId = parseInt(tabElement.dataset.tabId || 0);
                    const tab = tabs.find(t => t.id === tabId);
                    if (tab && !tabsToRemove.includes(tabElement)) {
                        updateTabElement(tabElement, tab);
                    }
                });

                // Add new tabs with animation
                tabsToAdd.forEach(tab => {
                    const tabElement = createTabElement(tab);
                    tabElement.dataset.tabId = tab.id;
                    tabElement.classList.add('tab-entering');
                    tabsContainer.appendChild(tabElement);
                    
                    // Trigger animation
                    requestAnimationFrame(() => {
                        tabElement.classList.remove('tab-entering');
                    });
                });

                // Finish rendering
                setTimeout(() => {
                    isRenderingTabs = false;
                    if (pendingTabUpdate) {
                        pendingTabUpdate = false;
                        renderTabs();
                    }
                }, 50);
            }

            function createTabElement(tab) {
                const tabElement = document.createElement("div");
                tabElement.className = `tab${tab.active ? " active" : ""}`;
                tabElement.onclick = () => switchToTab(tab.id);
                tabElement.draggable = true;
                tabElement.dataset.tabId = tab.id;

                // Drag & Drop event listeners
                tabElement.addEventListener('dragstart', handleDragStart);
                tabElement.addEventListener('dragover', handleDragOver);
                tabElement.addEventListener('drop', handleDrop);
                tabElement.addEventListener('dragend', handleDragEnd);
                tabElement.addEventListener('dragenter', handleDragEnter);
                tabElement.addEventListener('dragleave', handleDragLeave);

                // Favicon container
                const favicon = document.createElement("div");
                favicon.className = "tab-favicon";
                updateFavicon(favicon, tab.url);

                const title = document.createElement("span");
                title.className = "tab-title";
                title.textContent = tab.title || getTabTitle(tab.url) || "New Tab";

                const closeButton = document.createElement("span");
                closeButton.className = "tab-close";
                closeButton.innerHTML = '<i class="fas fa-times"></i>';
                closeButton.onclick = (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    closeTab(tab.id, e);
                };
                closeButton.onmousedown = (e) => {
                    e.stopPropagation(); // Prevent drag from starting when clicking close button
                };

                tabElement.appendChild(favicon);
                tabElement.appendChild(title);
                tabElement.appendChild(closeButton);

                return tabElement;
            }

            // Drag & Drop functionality for tabs
            let draggedTab = null;
            let draggedTabId = null;

            function handleDragStart(e) {
                draggedTab = e.target;
                draggedTabId = parseInt(e.target.dataset.tabId);
                e.target.classList.add('dragging');
                
                // Set drag data
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/html', e.target.outerHTML);
                e.dataTransfer.setData('text/plain', draggedTabId.toString());
            }

            function handleDragOver(e) {
                if (e.preventDefault) {
                    e.preventDefault();
                }
                e.dataTransfer.dropEffect = 'move';
                return false;
            }

            function handleDragEnter(e) {
                if (e.target === draggedTab) return;
                
                const tabsContainer = document.querySelector('.tabs');
                const tabs = Array.from(tabsContainer.children);
                const draggedIndex = tabs.indexOf(draggedTab);
                const targetIndex = tabs.indexOf(e.target.closest('.tab'));
                
                if (targetIndex !== -1 && targetIndex !== draggedIndex) {
                    // Clear all drag-over classes
                    tabs.forEach(tab => {
                        tab.classList.remove('drag-over', 'drag-over-left');
                    });
                    
                    // Add appropriate class based on drop position
                    if (targetIndex > draggedIndex) {
                        e.target.closest('.tab').classList.add('drag-over');
                    } else {
                        e.target.closest('.tab').classList.add('drag-over-left');
                    }
                }
            }

            function handleDragLeave(e) {
                // Only remove classes if we're leaving the tab entirely
                if (!e.target.closest('.tab').contains(e.relatedTarget)) {
                    e.target.closest('.tab').classList.remove('drag-over', 'drag-over-left');
                }
            }

            function handleDrop(e) {
                if (e.stopPropagation) {
                    e.stopPropagation();
                }
                
                if (draggedTab !== e.target.closest('.tab')) {
                    const tabsContainer = document.querySelector('.tabs');
                    const tabs = Array.from(tabsContainer.children);
                    const draggedIndex = tabs.indexOf(draggedTab);
                    const targetIndex = tabs.indexOf(e.target.closest('.tab'));
                    
                    if (targetIndex !== -1 && targetIndex !== draggedIndex) {
                        // Reorder tabs in the DOM
                        if (targetIndex > draggedIndex) {
                            // Insert after target
                            tabsContainer.insertBefore(draggedTab, tabs[targetIndex].nextSibling);
                        } else {
                            // Insert before target
                            tabsContainer.insertBefore(draggedTab, tabs[targetIndex]);
                        }
                        
                        // Reorder tabs in our data structure
                        reorderTabsInArray(draggedTabId, targetIndex);
                        
                        // Send reorder request to main process
                        if (window.electronAPI && window.electronAPI.reorderTabs) {
                            const newOrder = Array.from(tabsContainer.children).map(tab => 
                                parseInt(tab.dataset.tabId)
                            );
                            window.electronAPI.reorderTabs(newOrder);
                        }
                    }
                }
                
                return false;
            }

            function handleDragEnd(e) {
                e.target.classList.remove('dragging');
                
                // Clear all drag-over classes
                const tabs = document.querySelectorAll('.tab');
                tabs.forEach(tab => {
                    tab.classList.remove('drag-over', 'drag-over-left');
                });
                
                draggedTab = null;
                draggedTabId = null;
            }

            function reorderTabsInArray(draggedId, targetIndex) {
                const draggedTabIndex = tabs.findIndex(tab => tab.id === draggedId);
                if (draggedTabIndex !== -1) {
                    // Remove dragged tab from array
                    const [draggedTabData] = tabs.splice(draggedTabIndex, 1);
                    
                    // Calculate new position
                    let newIndex = targetIndex;
                    if (draggedTabIndex < targetIndex) {
                        newIndex = targetIndex - 1;
                    }
                    
                    // Insert at new position
                    tabs.splice(newIndex, 0, draggedTabData);
                }
            }

            function updateTabElement(tabElement, tab) {
                // Ensure drag & drop functionality
                if (!tabElement.draggable) {
                    tabElement.draggable = true;
                    tabElement.dataset.tabId = tab.id;
                    
                    // Add drag & drop event listeners if not already added
                    if (!tabElement.hasAttribute('data-drag-enabled')) {
                        tabElement.addEventListener('dragstart', handleDragStart);
                        tabElement.addEventListener('dragover', handleDragOver);
                        tabElement.addEventListener('drop', handleDrop);
                        tabElement.addEventListener('dragend', handleDragEnd);
                        tabElement.addEventListener('dragenter', handleDragEnter);
                        tabElement.addEventListener('dragleave', handleDragLeave);
                        tabElement.setAttribute('data-drag-enabled', 'true');
                    }
                }

                // Update active state with force refresh
                const wasActive = tabElement.classList.contains('active');
                const isActive = tab.active;
                
                // Force remove and add active class to ensure CSS is properly applied
                tabElement.classList.remove('active');
                if (isActive) {
                    // Use setTimeout to ensure the DOM has updated
                    setTimeout(() => {
                        tabElement.classList.add('active');
                    }, 10);
                }

                // Update title
                const titleElement = tabElement.querySelector('.tab-title');
                const newTitle = tab.title || getTabTitle(tab.url) || "New Tab";
                if (titleElement.textContent !== newTitle) {
                    titleElement.textContent = newTitle;
                }

                // Update favicon
                const faviconElement = tabElement.querySelector('.tab-favicon');
                updateFavicon(faviconElement, tab.url);
            }

            function updateFavicon(faviconElement, url) {
                if (url && url !== "about:blank") {
                    try {
                        const urlObj = new URL(url);
                        const expectedFavicon = `https://www.google.com/s2/favicons?domain=${urlObj.hostname}&sz=16`;
                        const currentImg = faviconElement.querySelector('img');
                        
                        if (!currentImg || currentImg.src !== expectedFavicon) {
                            faviconElement.innerHTML = `<img src="${expectedFavicon}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 16 16\\'%3E%3Ccircle cx=\\'8\\' cy=\\'8\\' r=\\'7\\' fill=\\'%23757575\\'/%3E%3C/svg%3E'">`;
                        }
                    } catch {
                        if (!faviconElement.querySelector('i')) {
                            faviconElement.innerHTML = '<i class="fas fa-globe"></i>';
                        }
                    }
                } else {
                    if (!faviconElement.querySelector('i')) {
                        faviconElement.innerHTML = '<i class="fas fa-globe"></i>';
                    }
                }
            }

            // Improved tab switching with error handling - SECOND OCCURRENCE
            function switchToTab(tabId) {
                console.log(`[UI] Switching to tab ${tabId}`);
                
                if (!tabId) {
                    console.error("[UI] switchToTab called with invalid tabId");
                    return;
                }

                // Prevent double-clicking with shorter timeout
                const tabElement = document.querySelector(`[data-tab-id="${tabId}"]`);
                if (tabElement && tabElement.classList.contains('switching')) {
                    console.log("[UI] Tab switch already in progress");
                    return;
                }

                // Mark as switching with shorter timeout
                if (tabElement) {
                    tabElement.classList.add('switching');
                    setTimeout(() => {
                        tabElement.classList.remove('switching');
                    }, 300); // Reduced from 1000ms to 300ms
                }

                // Call electron API with better error handling
                window.electronAPI.switchTab(tabId)
                    .then((success) => {
                        if (success) {
                            console.log(`[UI] Successfully switched to tab ${tabId}`);
                            // Force immediate UI update
                            setTimeout(() => {
                                const activeTab = tabs.find(t => t.id === tabId);
                                if (activeTab) {
                                    activeTab.active = true;
                                    tabs.forEach(t => {
                                        if (t.id !== tabId) t.active = false;
                                    });
                                    renderTabs();
                                }
                            }, 50);
                        } else {
                            console.error(`[UI] Failed to switch to tab ${tabId}`);
                            // Remove switching class on failure
                            if (tabElement) {
                                tabElement.classList.remove('switching');
                            }
                        }
                    })
                    .catch((error) => {
                        console.error(`[UI] Error switching to tab ${tabId}:`, error);
                        // Remove switching class on error
                        if (tabElement) {
                            tabElement.classList.remove('switching');
                        }
                    });
            }

            function closeTab(tabId, event) {
                console.log(`[UI] Closing tab ${tabId}`);
                
                if (event) {
                    event.stopPropagation();
                    event.preventDefault();
                }

                if (!tabId) {
                    console.error("[UI] closeTab called with invalid tabId");
                    return;
                }

                // Prevent double-clicking with shorter timeout
                const tabElement = document.querySelector(`[data-tab-id="${tabId}"]`);
                if (tabElement && tabElement.classList.contains('closing')) {
                    console.log("[UI] Tab close already in progress");
                    return;
                }

                // Mark as closing
                if (tabElement) {
                    tabElement.classList.add('closing');
                    // Auto-remove closing class after 2 seconds as fallback
                    setTimeout(() => {
                        if (tabElement && tabElement.classList.contains('closing')) {
                            tabElement.classList.remove('closing');
                        }
                    }, 2000);
                }

                window.electronAPI.closeTab(tabId)
                    .then((success) => {
                        if (success) {
                            console.log(`[UI] Successfully closed tab ${tabId}`);
                            // Remove from local tabs array immediately
                            const index = tabs.findIndex(t => t.id === tabId);
                            if (index !== -1) {
                                tabs.splice(index, 1);
                                renderTabs();
                            }
                        } else {
                            console.error(`[UI] Failed to close tab ${tabId}`);
                            // Remove closing class on failure
                            if (tabElement) {
                                tabElement.classList.remove('closing');
                            }
                        }
                    })
                    .catch((error) => {
                        console.error(`[UI] Error closing tab ${tabId}:`, error);
                        // Remove closing class on error
                        if (tabElement) {
                            tabElement.classList.remove('closing');
                        }
                    });
            }

            // Update tab info when received from main process - OPTIMIZED with better active state handling
            window.electronAPI.onTabUpdate((tab) => {
                console.log(`[UI] Tab update received for tab ${tab.id}, active: ${tab.active}`);
                
                // Validate tab data
                if (!tab.id) {
                    console.error("[UI] Invalid tab update received - missing ID");
                    return;
                }

                // First, mark all tabs as inactive if this tab is becoming active
                if (tab.active) {
                    tabs.forEach((t) => {
                        if (t.id !== tab.id) {
                            t.active = false;
                        }
                    });
                }

                const existingTabIndex = tabs.findIndex((t) => t.id === tab.id);
                if (existingTabIndex !== -1) {
                    // Update existing tab with validation
                    const existingTab = tabs[existingTabIndex];
                    tabs[existingTabIndex] = { 
                        ...existingTab, 
                        ...tab,
                        // Ensure we don't overwrite with undefined values
                        url: tab.url || existingTab.url || "about:blank",
                        title: tab.title || existingTab.title || "New Tab"
                    };
                } else {
                    // Add new tab with defaults
                    tabs.push({
                        id: tab.id,
                        url: tab.url || "about:blank",
                        title: tab.title || "New Tab",
                        active: tab.active || false
                    });
                }

                // Only update UI for active tab immediately
                if (tab.active) {
                    if (tab.url && tab.url !== "about:blank") {
                        updateUrlDisplay(tab.url);
                        updateSecurityIcon(tab.url);
                    }
                    if (tab.title && tab.title.trim()) {
                        lastKnownTitle = tab.title;
                        document.title = `${tab.title} - Modern Browser`;
                    }
                }

                // Force immediate render for active state changes
                renderTabs();
            });

            // Handle tab close events
            window.electronAPI.onTabClosed((tabId) => {
                const index = tabs.findIndex((t) => t.id === tabId);
                if (index !== -1) {
                    tabs.splice(index, 1);
                    renderTabs();
                }
            });

            function getTabTitle(url) {
                if (!url || url === "about:blank") return "New Tab";
                try {
                    const urlObj = new URL(url);
                    return urlObj.hostname.replace("www.", "") || "New Tab";
                } catch {
                    return "New Tab";
                }
            }

            function goBack() {
                window.electronAPI.goBack();
            }

            function goForward() {
                window.electronAPI.goForward();
            }

            function refresh() {
                window.electronAPI.refresh();
                const refreshBtn = event.target.closest("button");
                refreshBtn.style.transform = "rotate(360deg)";
                setTimeout(() => {
                    refreshBtn.style.transform = "";
                }, 500);
            }

            function goHome() {
                window.electronAPI.goHome();
            }

            function updateUrlDisplay(url) {
                const urlDisplay = document.getElementById("urlDisplay");
                if (url && url !== "about:blank") {
                    urlDisplay.value = url;
                    updateSecurityIcon(url);
                } else {
                    urlDisplay.value = "";
                }
            }

            function updateSecurityIcon(url) {
                const secureIcon = document.getElementById("secureIcon");
                if (url.startsWith("https://")) {
                    secureIcon.className = "fas fa-lock secure-icon https";
                    secureIcon.style.color = "var(--accent-color)";
                } else if (url.startsWith("http://")) {
                    secureIcon.className =
                        "fas fa-exclamation-triangle secure-icon http";
                    secureIcon.style.color = "#ff6b6b";
                } else {
                    secureIcon.className = "fas fa-globe secure-icon";
                    secureIcon.style.color = "var(--text-secondary)";
                }
            }

            // Listen for URL updates from main process - REAL-TIME
            window.electronAPI.onUrlUpdate((url) => {
                updateUrlDisplay(url);
                updateSecurityIcon(url);
                // Hide loading indicator when URL updates
                const refreshButton = document.querySelector(
                    '.nav-group button[onclick="refresh()"]',
                );
                if (refreshButton) {
                    refreshButton.style.opacity = "1";
                    refreshButton.style.pointerEvents = "auto";
                }
            });

            // Real-time title tracking variables
            let lastKnownTitle = "";
            let titleUpdateInterval = null;

            // Listen for real-time title updates from main process
            window.electronAPI.onTitleUpdate((data) => {
                const { title, url } = data;

                // Update URL if provided
                if (url) {
                    updateUrlDisplay(url);
                    updateSecurityIcon(url);
                }

                // Update page title in browser if title exists
                if (title && title.trim()) {
                    lastKnownTitle = title;
                    document.title = `${title} - Modern Browser`;
                }

                // Update active tab title in tabs array
                const activeTab = tabs.find((t) => t.active);
                if (activeTab && title) {
                    activeTab.title = title;
                    if (url) activeTab.url = url;
                    renderTabs();
                }
            });

            // Aggressive title monitoring - checks every 250ms
            function startTitleMonitoring() {
                if (titleUpdateInterval) {
                    clearInterval(titleUpdateInterval);
                }

                titleUpdateInterval = setInterval(async () => {
                    try {
                        const currentTitle =
                            await window.electronAPI.getCurrentTitle();
                        const currentUrl =
                            await window.electronAPI.getCurrentUrl();

                        if (
                            currentTitle &&
                            currentTitle.trim() &&
                            currentTitle !== lastKnownTitle
                        ) {
                            lastKnownTitle = currentTitle;

                            // Update browser title immediately
                            document.title = `${currentTitle} - Modern Browser`;

                            // Update active tab in tabs array
                            const activeTab = tabs.find((t) => t.active);
                            if (activeTab) {
                                activeTab.title = currentTitle;
                                if (currentUrl) activeTab.url = currentUrl;
                                renderTabs();
                            }
                        }
                    } catch (error) {
                        // Ignore errors during monitoring
                    }
                }, 250); // Check every 250ms for ultra-fast title updates
            }

            // Stop title monitoring when page unloads
            window.addEventListener("beforeunload", () => {
                if (titleUpdateInterval) {
                    clearInterval(titleUpdateInterval);
                }
            });

            // Listen for loading events from main process
            window.electronAPI.onLoadingStarted(() => {
                showLoadingState();
                // Try to update URL and title even during loading
                setTimeout(() => {
                    Promise.all([
                        window.electronAPI.getCurrentUrl(),
                        window.electronAPI.getCurrentTitle(),
                    ])
                        .then(([url, title]) => {
                            if (url && url !== "about:blank") {
                                updateUrlDisplay(url);
                            }
                            if (
                                title &&
                                title.trim() &&
                                title !== lastKnownTitle
                            ) {
                                lastKnownTitle = title;
                                document.title = `${title} - Modern Browser`;
                                const activeTab = tabs.find((t) => t.active);
                                if (activeTab) {
                                    activeTab.title = title;
                                    renderTabs();
                                }
                            }
                        })
                        .catch(() => {});
                }, 100);
            });

            window.electronAPI.onLoadingStopped(() => {
                hideLoadingState();
                // Update URL and title when loading stops
                setTimeout(() => {
                    Promise.all([
                        window.electronAPI.getCurrentUrl(),
                        window.electronAPI.getCurrentTitle(),
                    ])
                        .then(([url, title]) => {
                            if (url && url !== "about:blank") {
                                updateUrlDisplay(url);
                            }
                            if (
                                title &&
                                title.trim() &&
                                title !== lastKnownTitle
                            ) {
                                lastKnownTitle = title;
                                document.title = `${title} - Modern Browser`;
                                const activeTab = tabs.find((t) => t.active);
                                if (activeTab) {
                                    activeTab.title = title;
                                    renderTabs();
                                }
                            }
                        })
                        .catch(() => {});
                }, 100);
            });

            // Add loading state management
            let isLoading = false;

            function showLoadingState() {
                isLoading = true;
                const refreshButton = document.querySelector(
                    '.nav-group button[onclick="refresh()"]',
                );
                if (refreshButton) {
                    refreshButton.style.opacity = "0.5";
                    refreshButton.style.pointerEvents = "none";
                }

                // Add loading animation to URL bar
                const urlBar = document.querySelector(".url-display");
                if (urlBar) {
                    urlBar.style.opacity = "0.7";
                }
            }

            function hideLoadingState() {
                isLoading = false;
                const refreshButton = document.querySelector(
                    '.nav-group button[onclick="refresh()"]',
                );
                if (refreshButton) {
                    refreshButton.style.opacity = "1";
                    refreshButton.style.pointerEvents = "auto";
                }

                const urlBar = document.querySelector(".url-display");
                if (urlBar) {
                    urlBar.style.opacity = "1";
                }
            }

            function navigateTo(url) {
                if (!url) return;

                // URL'yi düzgün formata getir
                if (
                    !url.startsWith("http://") &&
                    !url.startsWith("https://") &&
                    !url.startsWith("file://")
                ) {
                    url = "https://" + url;
                }

                // URL'yi hemen göster (navigation başlamadan önce)
                updateUrlDisplay(url);
                showLoadingState();

                window.electronAPI
                    .navigateTo(url)
                    .then(() => {
                        updateUrlDisplay(url);
                    })
                    .catch(() => {
                        hideLoadingState();
                    });
            }

            // Önceki newTab fonksiyonunu kullanıyoruz

            async function toggleBookmark() {
                const currentUrl = await window.electronAPI.getCurrentUrl();
                if (!currentUrl || currentUrl === "about:blank") return;

                const bookmarkButton =
                    document.getElementById("bookmarkButton");
                const icon = bookmarkButton.querySelector("i");

                const isBookmarked =
                    await window.electronAPI.isBookmarked(currentUrl);

                if (!isBookmarked) {
                    // Add bookmark
                    const title =
                        (await window.electronAPI.getCurrentTitle()) ||
                        getTabTitle(currentUrl);
                    await window.electronAPI.addBookmark({
                        url: currentUrl,
                        title,
                    });
                    icon.classList.remove("far");
                    icon.classList.add("fas");
                    bookmarkButton.classList.add("bookmarked");
                } else {
                    // Remove bookmark
                    await window.electronAPI.removeBookmark(currentUrl);
                    icon.classList.remove("fas");
                    icon.classList.add("far");
                    bookmarkButton.classList.remove("bookmarked");
                }
            }

            function openDownloads() {
                if (window.electronAPI && window.electronAPI.openDownloadsTab) {
                    window.electronAPI.openDownloadsTab();
                } else {
                    // Fallback for when electronAPI is not available
                    const downloadsUrl = "file://" + window.location.pathname.replace("index.html", "downloads.html");
                    newTab(downloadsUrl);
                }
            }

            // Downloads tracking
            let downloadCount = 0;

            function updateDownloadCount(count) {
                downloadCount = count;
                const countBadge = document.getElementById('downloadCount');
                
                if (count > 0) {
                    countBadge.textContent = count;
                    countBadge.style.display = 'block';
                } else {
                    countBadge.style.display = 'none';
                }
            }

            // Listen for download updates from main process if available
            if (window.electronAPI && window.electronAPI.onDownloadUpdate) {
                window.electronAPI.onDownloadUpdate((downloads) => {
                    const activeDownloads = downloads.filter(d => 
                        d.status === 'progress' || 
                        d.status === 'progressing' ||

            // Download notification system
            let activeDownloadNotifications = new Map();

            function showDownloadNotification(type, data) {

                notification.className = `download-notification ${type}`;
                notification.id = notificationId;

                let iconClass, title, content;

                    case 'completed':

            // Console Panel Functions
            function executeConsoleCommand(command) {
                if (!command.trim()) return;
                
                consoleHistory.push(command);
                historyIndex = consoleHistory.length;
                
                // Add command to console output
                addConsoleLog('> ' + command, 'log');
                
                try {
                    // Simple JavaScript evaluation for demo purposes
                    let result;
                    
                    // Built-in console commands
                    if (command === 'clear') {
                        clearConsole();
                        return;
                    } else if (command === 'help') {
                        addConsoleLog('Available commands:\n- clear: Clear console\n- help: Show this help\n- location: Show current URL\n- document: Access document object\n- window: Access window object', 'info');
                        return;
                    } else if (command === 'location') {
                        addConsoleLog(window.location.href, 'log');
                        return;
                    }
                    
                    // Simple expression evaluation
                    result = eval(command);
                    
                    if (result !== undefined) {
                        addConsoleLog(typeof result === 'object' ? JSON.stringify(result, null, 2) : String(result), 'log');
                    }
                } catch (error) {
                    addConsoleLog(`Error: ${error.message}`, 'error');
                }
            }

            function addConsoleLog(message, type = 'log') {

                logEntry.setAttribute('title', timestamp);
                
                output.appendChild(logEntry);
                output.scrollTop = output.scrollHeight;
                
                consoleLogs.push({ message, type, timestamp });

            // Elements Panel Functions
            function loadDOMTree() {
                const domTree = document.getElementById('domTree');
                const currentDoc = document; // In a real implementation, this would be the active tab's document
                
                domTree.innerHTML = '';
                
                function createDOMNode(element, indent = 0) {
                    const nodeDiv = document.createElement('div');
                    nodeDiv.className = 'dom-element';
                    nodeDiv.style.paddingLeft = (indent * 16) + 'px';
                    
                    let nodeText = `<${element.tagName.toLowerCase()}`;
                    
                    // Add important attributes
                    if (element.id) nodeText += ` id="${element.id}"`;
                    if (element.className) nodeText += ` class="${element.className}"`;
                    
                    nodeText += '>';
                    
                    nodeDiv.textContent = nodeText;
                    nodeDiv.addEventListener('click', () => {
                        document.querySelectorAll('.dom-element').forEach(el => el.classList.remove('selected'));
                        nodeDiv.classList.add('selected');
                        showElementStyles(element);
                    });
                    
                    return nodeDiv;
                }
                
                function traverseDOM(element, container, indent = 0) {
                    if (element.nodeType === 1) { // Element node
                        const nodeDiv = createDOMNode(element, indent);
                        container.appendChild(nodeDiv);
                        
                        // Add children (limit depth for performance)
                        if (indent < 3) {
                            for (let child of element.children) {
                                traverseDOM(child, container, indent + 1);
                            }
                        }
                    }
                }
                
                traverseDOM(currentDoc.documentElement, domTree);
            }

                    'margin', 'padding', 'border', 'background-color', 'color',
                    'font-size', 'font-family', 'z-index'

                importantStyles.forEach(prop => {
                    const value = computedStyles.getPropertyValue(prop);
                    if (value) {

                        styleDiv.style.padding = '2px 0';

                });
            }

            function showStorageData(storageType) {
                const storageBody = document.getElementById('storageBody');
                storageBody.innerHTML = '';
                
                let storage;
                switch(storageType) {
                    case 'localStorage':
                        storage = localStorage;
                        break;
                    case 'sessionStorage':

                        break;
                    case 'cookies':
                        showCookieData();

                for (let i = 0; i < storage.length; i++) {
                    const key = storage.key(i);
                    const value = storage.getItem(key);
                    
                    const row = document.createElement('div');
                    row.style.display = 'flex';

                // Application panel storage items
                document.querySelectorAll('.app-item').forEach(item => {
                    item.addEventListener('click', () => {
                        showStorageData(item.dataset.storage);
                    });
                });
                
                // Initialize with some sample data
                addConsoleLog('Developer Console ready. Type "help" for available commands.', 'info');
                
                // Sample network logs for demo
                setTimeout(() => {
                    addNetworkLog('index.html', '200', 'document', '15.2 KB', 45);
                    addNetworkLog('style.css', '200', 'stylesheet', '8.7 KB', 12);
                    addNetworkLog('script.js', '200', 'script', '23.1 KB', 28);
                }, 1000);
                
                // Image copy notifications
                window.electronAPI.onImageCopied((result) => {
                    if (result.success) {
                        showToast('Image copied to clipboard!', 'success');
                    } else {
                        showToast('Failed to copy image: ' + (result.error || 'Unknown error'), 'error');
                    }
                });

                window.electronAPI.onImageAddressCopied((result) => {
                    if (result.success) {
                        showToast('Image address copied to clipboard!', 'success');
                    }
                });

                // Link copy notifications
                window.electronAPI.onLinkCopied((result) => {
                    if (result.success) {
                        showToast('Link address copied to clipboard!', 'success');
                    }
                });

                // Image save notifications
                window.electronAPI.onImageSaved((result) => {
                    if (result.success) {
                        showToast('Image saved successfully!', 'success');
                    } else {
                        showToast('Failed to save image: ' + (result.error || 'Unknown error'), 'error');
                    }
                });
            });

            // Toast notification system
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;

                const toastContainer = document.getElementById('toastContainer') || createToastContainer();
                toastContainer.appendChild(toast);

                // Trigger animation
                setTimeout(() => toast.classList.add('show'), 100);

                // Remove after 3 seconds
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => {
                        if (toast.parentNode) {
                            toast.parentNode.removeChild(toast);
                        }
                    }, 300);
                }, 3000);
            }

            function createToastContainer() {
                const container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'toast-container';
                document.body.appendChild(container);
                return container;
            }
        </script>

        <!-- Toast notification styles -->

            /* Download notification styles */
            .download-notification {

                -webkit-backdrop-filter: blur(var(--blur-amount));
                transform: translateX(100%);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                opacity: 0;
            }

            .download-notification.show {
                transform: translateX(0);
                opacity: 1;
            }

            .download-notification-header {
                display: flex;

                gap: 12px;
                margin-bottom: 8px;
            }

            .download-notification-icon {
                width: 24px;

                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 12px;
            }

            .download-notification-title {
                font-weight: 600;

            }

            .download-notification-close {
                margin-left: auto;

                border: none;
                color: var(--text-secondary);

                padding: 4px;

            .download-notification-close:hover {

            .download-notification-content {

            }

            .download-notification-filename {

            }

            .download-notification-progress {
                width: 100%;

            .download-notification-progress-fill {
                height: 100%;

            }

            .download-notification.completed .download-notification-progress-fill {
                background: var(--success-color);

            .download-notification.failed .download-notification-progress-fill {
                background: var(--error-color);
            }

            /* Light mode adjustments for download notifications */
            :root.light-mode .download-notification {
                background: white;
