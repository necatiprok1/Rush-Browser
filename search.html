<!doctype html>
<html>
    <head>
        <title>Rush Browser</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        />
        <style>
            .controls {
                position: fixed;
                top: 20px;
                right: 20px;
                display: flex;
                align-items: center;
                gap: 16px;
                z-index: 100;
            }

            @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

            :root {
                --primary-color: #ffffff;
                --hover-color: rgba(255, 255, 255, 0.1);
                --bg-color: #0a0a0f;
                --text-color: #ffffff;
                --text-secondary: rgba(255, 255, 255, 0.7);
                --surface-color: rgba(255, 255, 255, 0.05);
                --border-color: rgba(255, 255, 255, 0.1);
                --shadow-color: rgba(0, 0, 0, 0.2);
                --glow-color: rgba(255, 255, 255, 0.03);
            }

            :root.light-mode {
                --bg-color: #f8fafc;
                --text-color: #1e293b;
                --text-secondary: #64748b;
                --surface-color: rgba(0, 0, 0, 0.05);
                --border-color: rgba(0, 0, 0, 0.1);
                --hover-color: rgba(0, 0, 0, 0.05);
                --shadow-color: rgba(0, 0, 0, 0.1);
                --glow-color: rgba(0, 0, 0, 0.02);
            }

            /* Font Size Control */
            :root {
                --base-font-size: 1rem;
            }

            .font-small {
                --base-font-size: 0.875rem;
            }

            .font-small * {
                font-size: calc(var(--base-font-size) * 0.9) !important;
            }

            .font-medium {
                --base-font-size: 1rem;
            }

            .font-medium * {
                font-size: var(--base-font-size) !important;
            }

            .font-large {
                --base-font-size: 1.125rem;
            }

            .font-large * {
                font-size: calc(var(--base-font-size) * 1.1) !important;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 0;
                font-family:
                    "Inter",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                background-color: var(--bg-color);
                color: var(--text-color);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: relative;
                overflow: hidden;
            }

            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background:
                    radial-gradient(
                        circle at 20% 80%,
                        rgba(255, 255, 255, 0.03) 0%,
                        transparent 50%
                    ),
                    radial-gradient(
                        circle at 80% 20%,
                        rgba(255, 255, 255, 0.03) 0%,
                        transparent 50%
                    ),
                    radial-gradient(
                        circle at 40% 40%,
                        rgba(255, 255, 255, 0.02) 0%,
                        transparent 50%
                    );
                pointer-events: none;
                z-index: -1;
                opacity: 0.8;
                transition: opacity 0.3s ease;
            }

            .search-container {
                text-align: center;
                padding: 40px;
                max-width: 680px;
                width: 100%;
                animation: fadeIn 0.5s ease-out;
            }

            .logo-container {
                margin-bottom: 40px;
                position: relative;
            }

            .logo {
                width: 180px;
                height: auto;
                filter: drop-shadow(0 4px 20px rgba(255, 255, 255, 0.1));
                transition: transform 0.3s ease;
            }

            .logo:hover {
                transform: translateY(-2px);
            }

            .search-box {
                width: 100%;
                position: relative;
                margin-bottom: 30px;
                z-index: 1001; /* Ensure search box is above other elements */
            }

            .search-input-container {
                position: relative;
                width: 100%;
                height: 56px;
            }

            .search-input {
                width: 100%;
                height: 100%;
                padding: 0 60px;
                font-size: 16px;
                background: var(--surface-color);
                color: var(--text-color);
                border: 1px solid var(--border-color);
                border-radius: 28px;
                outline: none;
                transition: all 0.3s ease;
                font-family: inherit;
            }

            .search-input:focus {
                border-color: rgba(255, 255, 255, 0.2);
                box-shadow: 0 0 0 2px var(--glow-color);
            }

            /* When suggestions are shown, remove bottom border radius and shadow */
            .search-input.suggestions-active {
                border-radius: 28px 28px 0 0 !important;
                border-bottom-color: transparent !important;
                box-shadow: none !important;
            }

            /* When suggestions are visible, modify input border radius */
            .search-input-container:has(.search-suggestions.show) .search-input {
                border-radius: 28px 28px 0 0;
                border-bottom-color: transparent;
                box-shadow: none;
            }

            .search-icon {
                position: absolute;
                left: 20px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-secondary);
                font-size: 18px;
                pointer-events: none;
                transition: color 0.3s ease;
            }

            .search-input:focus + .search-icon {
                color: var(--text-color);
            }

            /* Search Suggestions Dropdown */
            .search-suggestions {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--surface-color);
                border: 1px solid var(--border-color);
                border-top: none;
                border-radius: 0 0 16px 16px;
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                box-shadow: 0 8px 32px var(--shadow-color);
                opacity: 0;
                transform: translateY(-5px);
                pointer-events: none;
                transition: all 0.2s ease;
                z-index: 1000;
                max-height: 300px;
                overflow-y: auto;
            }

            .search-suggestions.show {
                opacity: 1;
                transform: translateY(0);
                pointer-events: all;
            }

            .suggestions-header {
                padding: 8px 20px 4px;
                font-size: 11px;
                font-weight: 500;
                color: var(--text-secondary);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                display: none; /* Hide headers for more Google-like appearance */
            }

            .suggestion-item {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 10px 20px;
                cursor: pointer;
                transition: background-color 0.1s ease;
                font-size: 16px;
                min-height: 44px;
                text-align: left;
            }

            .suggestion-item:hover,
            .suggestion-item.highlighted {
                background: var(--hover-color);
            }

            .suggestion-icon {
                width: 20px;
                height: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text-secondary);
                font-size: 14px;
                flex-shrink: 0;
            }

            /* Special styling for popular searches */
            .suggestion-item[data-type="popular"] .suggestion-icon {
                color: #f59e0b; /* Orange color for trending/popular items */
            }

            .suggestion-text {
                flex: 1;
                font-size: 16px;
                color: var(--text-color);
                line-height: 1.3;
                font-weight: 400;
                text-align: left;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
            }

            .suggestion-text .highlight {
                font-weight: 600;
                color: inherit;
            }

            .suggestion-remove {
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 12px;
                opacity: 0;
                transition: all 0.15s ease;
                color: var(--text-secondary);
                font-size: 14px;
                cursor: pointer;
                flex-shrink: 0;
                user-select: none;
                -webkit-user-select: none;
                position: relative;
                z-index: 10;
            }

            .suggestion-item:hover .suggestion-remove {
                opacity: 0.6;
            }

            .suggestion-remove:hover {
                opacity: 1 !important;
                background: rgba(239, 68, 68, 0.1);
                color: #ef4444;
                transform: scale(1.1);
            }

            .suggestion-remove:active {
                transform: scale(0.95);
            }

            .clear-history {
                padding: 8px 20px;
                text-align: left;
                border-top: 1px solid var(--border-color);
            }

            .clear-history button {
                background: none;
                border: none;
                color: var(--text-secondary);
                padding: 8px 0;
                font-size: 14px;
                cursor: pointer;
                transition: color 0.2s ease;
                font-family: inherit;
                display: flex;
                align-items: center;
                gap: 8px;
                text-align: left;
            }

            .clear-history button:hover {
                color: var(--text-color);
            }

            .clear-history button i {
                font-size: 12px;
            }

            /* History and suggestions sections */
            .suggestions-section {
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            }

            .suggestions-section:last-of-type {
                border-bottom: none;
            }

            /* Custom scrollbar for suggestions */
            .search-suggestions::-webkit-scrollbar {
                width: 6px;
            }

            .search-suggestions::-webkit-scrollbar-track {
                background: transparent;
            }

            .search-suggestions::-webkit-scrollbar-thumb {
                background: var(--border-color);
                border-radius: 3px;
            }

            .search-suggestions::-webkit-scrollbar-thumb:hover {
                background: var(--text-secondary);
            }

            .quick-links {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 16px;
                margin-top: 40px;
                padding: 0 20px;
            }

            .quick-link {
                display: flex;
                align-items: center;
                padding: 12px 16px;
                background: var(--surface-color);
                border: 1px solid var(--border-color);
                border-radius: 12px;
                color: var(--text-color);
                text-decoration: none;
                transition: all 0.3s ease;
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }

            .quick-link:hover {
                background: var(--hover-color);
                border-color: rgba(255, 255, 255, 0.15);
                transform: translateY(-2px);
            }

            .quick-link i {
                margin-right: 12px;
                font-size: 18px;
                color: var(--text-secondary);
            }

            .quick-link span {
                font-size: 14px;
                font-weight: 500;
            }

            .header-controls {
                position: fixed;
                top: 20px;
                right: 20px;
                display: flex;
                align-items: center;
                gap: 16px;
                z-index: 100;
            }

            .control-button {
                width: 40px;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--surface-color);
                border: 1px solid var(--border-color);
                border-radius: 12px;
                color: var(--text-secondary);
                cursor: pointer;
                transition: all 0.3s ease;
                position: relative;
                overflow: hidden;
            }

            .control-button:hover {
                background: var(--hover-color);
                border-color: var(--text-secondary);
                transform: translateY(-2px);
            }

            .control-button i {
                font-size: 18px;
                transition: all 0.3s ease;
            }

            .profile-button {
                width: auto;
                min-width: 40px;
                padding: 0 16px;
                gap: 8px;
                background: var(--surface-color);
            }

            .profile-button img {
                width: 28px;
                height: 28px;
                border-radius: 8px;
                object-fit: cover;
            }

            .dropdown-header {
                padding: 16px;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .dropdown-header img {
                width: 48px;
                height: 48px;
                border-radius: 12px;
                object-fit: cover;
            }

            .profile-info {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .profile-info span {
                font-size: 14px;
                line-height: 1.4;
            }

            .profile-info .text-secondary {
                color: var(--text-secondary);
                font-size: 12px;
            }

            #signedOutState {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            #signedOutState i {
                font-size: 20px;
            }

            #signedOutState span {
                font-size: 14px;
                font-weight: 500;
            }

            .dropdown-menu {
                position: absolute;
                top: 100%;
                right: 0;
                margin-top: 8px;
                background: var(--surface-color);
                border: 1px solid var(--border-color);
                border-radius: 12px;
                padding: 8px;
                min-width: 200px;
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                box-shadow: 0 4px 20px var(--shadow-color);
                opacity: 0;
                transform: translateY(-10px);
                pointer-events: none;
                transition: all 0.3s ease;
            }

            .dropdown-menu.show {
                opacity: 1;
                transform: translateY(0);
                pointer-events: all;
            }

            .dropdown-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 16px;
                color: var(--text-color);
                text-decoration: none;
                border-radius: 8px;
                transition: all 0.2s ease;
                font-size: 14px;
            }

            .dropdown-item:hover {
                background: var(--hover-color);
            }

            .dropdown-item i {
                font-size: 16px;
                color: var(--text-secondary);
            }

            .dropdown-divider {
                height: 1px;
                background: var(--border-color);
                margin: 8px 0;
            }

            .version-badge {
                position: absolute;
                top: -6px;
                right: -6px;
                background: #10b981;
                color: white;
                font-size: 10px;
                padding: 2px 6px;
                border-radius: 10px;
                font-weight: 600;
            }

            @keyframes rotate {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (max-width: 640px) {
                .search-container {
                    padding: 20px;
                }

                .logo {
                    width: 140px;
                }

                .quick-links {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
        </style>
    </head>
    <body>
        <div class="header-controls">
            <button
                class="control-button profile-button"
                onclick="toggleDropdown('profileMenu')"
                title="Google Account"
                id="profileButton"
            >
                <div id="signedOutState">
                    <i class="fas fa-user-circle"></i>
                    <span>Sign in</span>
                </div>
                <div id="signedInState" style="display: none">
                    <img src="" alt="Profile" id="profileImage" />
                    <span id="profileName"></span>
                </div>
            </button>

            <button
                class="control-button theme-button"
                onclick="toggleDarkMode()"
                title="Toggle Theme"
            >
                <i class="fas fa-sun"></i>
            </button>

            <button
                class="control-button"
                onclick="toggleDropdown('settingsMenu')"
                title="Settings"
            >
                <i class="fas fa-cog"></i>
            </button>

            <button
                class="control-button"
                onclick="toggleDropdown('moreMenu')"
                title="More"
            >
                <i class="fas fa-ellipsis-v"></i>
                <span
                    class="version-badge"
                    id="updateBadge"
                    style="display: none"
                    >New</span
                >
            </button>

            <button
                class="control-button"
                onclick="showFeedback()"
                title="Send Feedback"
            >
                <i class="fas fa-comment-alt"></i>
            </button>

            <!-- Profile Dropdown Menu -->
            <div class="dropdown-menu" id="profileMenu">
                <!-- Signed Out State -->
                <div id="signedOutMenu">
                    <a
                        href="#"
                        class="dropdown-item"
                        onclick="signInWithGoogle()"
                    >
                        <i class="fab fa-google"></i>
                        Sign in with Google
                    </a>
                </div>
                <!-- Signed In State -->
                <div id="signedInMenu" style="display: none">
                    <div class="dropdown-header">
                        <img src="" alt="Profile" id="profileImageLarge" />
                        <div class="profile-info">
                            <span id="profileFullName"></span>
                            <span
                                id="profileEmail"
                                class="text-secondary"
                            ></span>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item" onclick="manageAccount()">
                        <i class="fas fa-user-circle"></i>
                        Manage Account
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item" onclick="signOut()">
                        <i class="fas fa-sign-out-alt"></i>
                        Sign Out
                    </a>
                </div>
            </div>

            <!-- Settings Dropdown Menu -->
            <div class="dropdown-menu" id="settingsMenu">
                <a
                    href="#"
                    class="dropdown-item"
                    onclick="openSettings('general')"
                >
                    <i class="fas fa-cog"></i>
                    General Settings
                </a>
                <a
                    href="#"
                    class="dropdown-item"
                    onclick="openSettings('appearance')"
                >
                    <i class="fas fa-paint-brush"></i>
                    Appearance
                </a>
                <a
                    href="#"
                    class="dropdown-item"
                    onclick="openSettings('privacy')"
                >
                    <i class="fas fa-shield-alt"></i>
                    Privacy & Security
                </a>
            </div>

            <!-- More Dropdown Menu -->
            <div class="dropdown-menu" id="moreMenu">
                <a href="#" class="dropdown-item" onclick="showHistory()">
                    <i class="fas fa-history"></i>
                    History
                </a>
                <a href="#" class="dropdown-item" onclick="importBookmarks()">
                    <i class="fas fa-bookmark"></i>
                    Import Bookmarks
                </a>
                <a href="#" class="dropdown-item" onclick="clearCache()">
                    <i class="fas fa-broom"></i>
                    Clear Cache
                </a>
                <a href="#" class="dropdown-item" onclick="toggleDevTools()">
                    <i class="fas fa-code"></i>
                    Developer Tools
                </a>
                <div class="dropdown-divider"></div>
                <a href="#" class="dropdown-item" onclick="checkForUpdates()">
                    <i class="fas fa-sync"></i>
                    Check for Updates
                </a>
                <a href="#" class="dropdown-item" onclick="getHelp()">
                    <i class="fas fa-question-circle"></i>
                    Help & Support
                </a>
                <div class="dropdown-divider"></div>
                <div class="dropdown-item">
                    <i class="fas fa-info-circle"></i>
                    Version 1.0.0
                </div>
            </div>
        </div>

        <div class="search-container">
            <div class="logo-container">
                <img
                    src="https://i.imghippo.com/files/AS2968KbU.png"
                    alt="Rush Browser"
                    class="logo"
                />
            </div>

            <div class="search-box">
                <div class="search-input-container">
                    <input
                        type="text"
                        class="search-input"
                        placeholder="Search the web"
                        autofocus
                        id="searchInput"
                        autocomplete="off"
                    />
                    <i class="fas fa-search search-icon"></i>
                    
                    <!-- Search Suggestions Dropdown -->
                    <div class="search-suggestions" id="searchSuggestions">
                        <!-- History Section -->
                        <div class="suggestions-section" id="historySection">
                            <div id="historyItems"></div>
                        </div>
                        
                        <!-- Suggestions Section -->
                        <div class="suggestions-section" id="suggestionsSection">
                            <div id="suggestionItems"></div>
                        </div>
                        
                        <!-- Clear History Button -->
                        <div class="clear-history" id="clearHistorySection">
                            <button onclick="clearSearchHistory()">
                                <i class="fas fa-trash-alt"></i>
                                Clear search history
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="quick-links">
                <a href="https://github.com" class="quick-link">
                    <i class="fab fa-github"></i>
                    <span>GitHub</span>
                </a>
                <a href="https://youtube.com" class="quick-link">
                    <i class="fab fa-youtube"></i>
                    <span>YouTube</span>
                </a>
                <a href="https://twitter.com" class="quick-link">
                    <i class="fab fa-twitter"></i>
                    <span>Twitter</span>
                </a>
                <a href="https://linkedin.com" class="quick-link">
                    <i class="fab fa-linkedin"></i>
                    <span>LinkedIn</span>
                </a>
            </div>
        </div>

        <script>
            // Theme management
            let isLightMode = false;

            async function initializeTheme() {
                // Get saved theme from main process
                const isDarkMode = await window.electronAPI.isDarkMode();
                isLightMode = !isDarkMode;
                updateTheme();
            }

            async function toggleDarkMode() {
                isLightMode = !isLightMode;
                await window.electronAPI.toggleDarkMode(!isLightMode);
                updateTheme();
            }

            // Tema değişikliklerini dinle
            window.electronAPI.onThemeChange((isDarkMode) => {
                isLightMode = !isDarkMode;
                updateTheme();
            });

            function updateTheme() {
                document.documentElement.classList.toggle(
                    "light-mode",
                    isLightMode,
                );

                const themeButton = document.querySelector(".theme-button");
                const icon = themeButton.querySelector("i");

                if (isLightMode) {
                    icon.className = "fas fa-sun";
                    themeButton.title = "Switch to Dark Mode";
                } else {
                    icon.className = "fas fa-moon";
                    themeButton.title = "Switch to Light Mode";
                }

                // Logo rengini temaya göre güncelle
                const logo = document.querySelector(".logo");
                if (logo) {
                    if (isLightMode) {
                        // Light Theme - Logo siyah olacak
                        logo.style.filter = "brightness(0)";
                    } else {
                        // Dark Theme - Logo beyaz olacak
                        logo.style.filter = "brightness(0) invert(1)";
                    }
                }
            }

            // Dropdown menus
            let activeDropdown = null;

            function toggleDropdown(menuId) {
                const menu = document.getElementById(menuId);

                // Close any open dropdown
                if (activeDropdown && activeDropdown !== menu) {
                    activeDropdown.classList.remove("show");
                }

                menu.classList.toggle("show");
                activeDropdown = menu.classList.contains("show") ? menu : null;
            }

            // Close dropdowns when clicking outside
            document.addEventListener("click", (e) => {
                if (
                    activeDropdown &&
                    !e.target.closest(".control-button") &&
                    !e.target.closest(".dropdown-menu")
                ) {
                    activeDropdown.classList.remove("show");
                    activeDropdown = null;
                }
            });

            // Google Auth
            window.onload = async function () {
                updateTheme();
                await initializeGoogleAuth();
                checkForUpdates();
            };

            async function initializeGoogleAuth() {
                try {
                    const userInfo =
                        await window.electronAPI.getGoogleUserInfo();
                    if (userInfo) {
                        document.getElementById("profileImage").src =
                            userInfo.picture;
                        document.getElementById("profileName").textContent =
                            userInfo.name.split(" ")[0];
                    }
                } catch (error) {
                    console.error("Failed to get Google user info:", error);
                }
            }

            // Functions for menu items
            function showHistory() {
                window.electronAPI.showHistory();
            }

            function importBookmarks() {
                window.electronAPI.importBookmarks();
            }

            function clearCache() {
                window.electronAPI.clearCache();
            }

            function toggleDevTools() {
                window.electronAPI.toggleDevTools();
            }

            function openSettings(section) {
                window.electronAPI.openSettingsTab(section || "general");
            }

            function manageAccount() {
                window.electronAPI.openUrl("https://myaccount.google.com");
            }

            function signOut() {
                window.electronAPI.signOut();
            }

            function showFeedback() {
                window.electronAPI.showFeedback();
            }

            async function checkForUpdates() {
                const hasUpdate = await window.electronAPI.checkForUpdates();
                const badge = document.getElementById("updateBadge");
                badge.style.display = hasUpdate ? "block" : "none";
            }

            function getHelp() {
                window.electronAPI.openUrl("https://support.rushbrowser.com");
            }

            // Get current search engine settings
            async function getCurrentSearchEngine() {
                try {
                    if (window.electronAPI && window.electronAPI.getSettings) {
                        const settings = await window.electronAPI.getSettings();
                        return settings.searchEngine || 'google';
                    }
                } catch (error) {
                    console.log('Failed to get search engine setting:', error);
                }
                return 'google'; // Default fallback
            }

            // Search engines configuration
            const searchEngines = {
                google: {
                    name: "Google",
                    searchUrl: "https://www.google.com/search?q=",
                    suggestUrl: "https://suggestqueries.google.com/complete/search?client=chrome&q="
                },
                bing: {
                    name: "Bing", 
                    searchUrl: "https://www.bing.com/search?q=",
                    suggestUrl: "https://api.bing.microsoft.com/qsonhs.aspx?type=cb&q="
                },
                duckduckgo: {
                    name: "DuckDuckGo",
                    searchUrl: "https://duckduckgo.com/?q=",
                    suggestUrl: "https://duckduckgo.com/ac/?q="
                },
                yahoo: {
                    name: "Yahoo",
                    searchUrl: "https://search.yahoo.com/search?p=",
                    suggestUrl: "https://search.yahoo.com/sugg/chrome?output=fxjson&command="
                }
            };

            // Perform search with current search engine
            async function performSearch(query) {
                if (!query.trim()) return;
                
                const currentEngine = await getCurrentSearchEngine();
                const engine = searchEngines[currentEngine] || searchEngines.google;
                const searchUrl = engine.searchUrl + encodeURIComponent(query.trim());
                
                window.location.href = searchUrl;
            }

            // Initialize theme on page load
            window.addEventListener("DOMContentLoaded", () => {
                initializeTheme();
                initializeFontSize();
            });

            // Font size functions
            async function initializeFontSize() {
                if (window.electronAPI && window.electronAPI.getFontSize) {
                    try {
                        const fontSize = await window.electronAPI.getFontSize();
                        applyFontSize(fontSize);
                    } catch (error) {
                        console.log('Failed to get font size:', error);
                        applyFontSize('medium'); // Default fallback
                    }
                } else {
                    applyFontSize('medium'); // Default fallback
                }
            }

            function applyFontSize(size) {
                // Remove existing font size classes
                document.documentElement.classList.remove('font-small', 'font-medium', 'font-large');
                
                // Add the new font size class
                if (size === 'small') {
                    document.documentElement.classList.add('font-small');
                } else if (size === 'medium') {
                    document.documentElement.classList.add('font-medium');
                } else if (size === 'large') {
                    document.documentElement.classList.add('font-large');
                }
            }

            // Listen for font size changes
            if (window.electronAPI && window.electronAPI.onFontSizeChange) {
                window.electronAPI.onFontSizeChange((fontSize) => {
                    applyFontSize(fontSize);
                });
            }

            // Search Suggestions and History System
            class SearchSuggestionManager {
                constructor() {
                    this.searchInput = document.getElementById('searchInput');
                    this.suggestionsContainer = document.getElementById('searchSuggestions');
                    this.historyItems = document.getElementById('historyItems');
                    this.suggestionItems = document.getElementById('suggestionItems');
                    this.historySection = document.getElementById('historySection');
                    this.suggestionsSection = document.getElementById('suggestionsSection');
                    this.clearHistorySection = document.getElementById('clearHistorySection');
                    
                    this.searchHistory = this.loadSearchHistory();
                    this.currentHighlight = -1;
                    this.currentSuggestions = [];
                    this.isVisible = false;
                    this.debounceTimer = null;
                    this.currentSearchEngine = 'google'; // Will be updated from settings
                    
                    // Initialize search engine
                    this.initializeSearchEngine();
                    
                    // Popular searches - like Google's trending searches
                    this.popularSearches = [
                        'ChatGPT',
                        'YouTube',
                        'Instagram',
                        'Facebook', 
                        'Twitter',
                        'GitHub',
                        'Netflix',
                        'Amazon',
                        'Google Translate',
                        'Wikipedia',
                        'LinkedIn',
                        'Stack Overflow',
                        'Reddit',
                        'TikTok',
                        'WhatsApp Web',
                        'Gmail',
                        'Weather',
                        'News',
                        'Sports',
                        'Music'
                    ];
                    
                    this.initializeEventListeners();
                }
                
                // Initialize current search engine from settings
                async initializeSearchEngine() {
                    try {
                        this.currentSearchEngine = await getCurrentSearchEngine();
                        console.log('Search engine initialized:', this.currentSearchEngine);
                    } catch (error) {
                        console.log('Failed to initialize search engine, using Google:', error);
                        this.currentSearchEngine = 'google';
                    }
                }
                
                // Get current suggest API URL based on search engine
                getSuggestApiUrl(query) {
                    const engine = searchEngines[this.currentSearchEngine] || searchEngines.google;
                    return engine.suggestUrl + encodeURIComponent(query);
                }
                
                initializeEventListeners() {
                    // Focus and blur events
                    this.searchInput.addEventListener('focus', () => {
                        this.showSuggestions();
                    });
                    
                    this.searchInput.addEventListener('blur', (e) => {
                        // Don't hide if we're clicking on remove buttons
                        setTimeout(() => {
                            const activeEl = document.activeElement;
                            const isInSuggestions = this.suggestionsContainer.contains(activeEl);
                            const isRemoveButton = activeEl && (
                                activeEl.classList.contains('suggestion-remove') || 
                                activeEl.closest('.suggestion-remove')
                            );
                            const isSearchInput = activeEl === this.searchInput;
                            
                            // Only hide if we're not interacting with suggestions
                            if (!isInSuggestions && !isRemoveButton && !isSearchInput) {
                                this.hideSuggestions();
                            }
                        }, 250); // Longer timeout for remove buttons
                    });
                    
                    // Input event for live suggestions
                    this.searchInput.addEventListener('input', (e) => {
                        this.handleInputWithDebounce(e.target.value);
                    });
                    
                    // Keyboard navigation
                    this.searchInput.addEventListener('keydown', (e) => {
                        this.handleKeydown(e);
                    });
                    
                    // Click outside to close
                    document.addEventListener('click', (e) => {
                        // Don't close if clicking on search input or suggestions container
                        if (!this.searchInput.contains(e.target) && 
                            !this.suggestionsContainer.contains(e.target)) {
                            this.hideSuggestions();
                        }
                    });
                    
                    // Escape key to close
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') {
                            this.hideSuggestions();
                            this.searchInput.blur();
                        }
                    });
                }
                
                handleInputWithDebounce(value) {
                    // Clear previous timer
                    if (this.debounceTimer) {
                        clearTimeout(this.debounceTimer);
                    }
                    
                    // Reset highlight
                    this.currentHighlight = -1;
                    
                    // Debounce API calls to avoid too many requests
                    this.debounceTimer = setTimeout(() => {
                        this.handleInput(value);
                    }, 150);
                }
                
                async handleInput(value) {
                    this.currentHighlight = -1;
                    
                    if (value.trim()) {
                        await this.fetchSearchSuggestions(value);
                    } else {
                        this.showOnlyHistory();
                    }
                    
                    if (!this.isVisible) {
                        this.showSuggestions();
                    }
                }
                
                async fetchSearchSuggestions(query) {
                    try {
                        // Update current search engine in case it changed
                        await this.initializeSearchEngine();
                        
                        if (this.currentSearchEngine === 'google') {
                            return await this.fetchGoogleSuggestions(query);
                        } else if (this.currentSearchEngine === 'bing') {
                            return await this.fetchBingSuggestions(query);
                        } else if (this.currentSearchEngine === 'duckduckgo') {
                            return await this.fetchDuckDuckGoSuggestions(query);
                        } else if (this.currentSearchEngine === 'yahoo') {
                            return await this.fetchYahooSuggestions(query);
                        } else {
                            // Default to Google
                            return await this.fetchGoogleSuggestions(query);
                        }
                    } catch (error) {
                        console.error('Error fetching suggestions:', error);
                        // Show history only if suggestions fail
                        this.renderHistory();
                        this.updateSectionsVisibility();
                    }
                }
                
                async fetchGoogleSuggestions(query) {
                    try {
                        // Try multiple Google Suggest endpoints
                        const endpoints = [
                            `https://www.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}`,
                            `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}`,
                            `https://clients1.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}`
                        ];
                        
                        // Try to fetch from CORS-enabled endpoint first
                        try {
                            const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(endpoints[1])}`);
                            if (response.ok) {
                                const text = await response.text();
                                // Parse JSONP response
                                const match = text.match(/\[.*\]/);
                                if (match) {
                                    const data = JSON.parse(match[0]);
                                    if (data && data[1] && Array.isArray(data[1])) {
                                        const suggestions = data[1].slice(0, 5);
                                        this.renderHistory();
                                        this.renderSuggestions(suggestions, query);
                                        this.updateSectionsVisibility();
                                        return;
                                    }
                                }
                            }
                        } catch (corsError) {
                            console.log('CORS proxy failed, trying JSONP...');
                        }
                        
                        // Fallback to JSONP
                        const script = document.createElement('script');
                        const callbackName = 'suggestionCallback_' + Date.now();
                        
                        // Create global callback
                        window[callbackName] = (data) => {
                            // Clean up
                            if (script.parentNode) {
                                document.head.removeChild(script);
                            }
                            delete window[callbackName];
                            
                            // Process suggestions
                            if (data && data[1] && Array.isArray(data[1])) {
                                const suggestions = data[1].slice(0, 5);
                                this.renderHistory();
                                this.renderSuggestions(suggestions, query);
                                this.updateSectionsVisibility();
                            }
                        };
                        
                        // Set up script for JSONP
                        script.src = `${endpoints[1]}&jsonp=${callbackName}`;
                        script.onerror = () => {
                            console.warn('Google Suggest API failed, using fallback');
                            this.generateFallbackSuggestions(query);
                            // Clean up
                            if (script.parentNode) {
                                document.head.removeChild(script);
                            }
                            delete window[callbackName];
                        };
                        
                        // Timeout for JSONP request
                        setTimeout(() => {
                            if (window[callbackName]) {
                                script.onerror();
                            }
                        }, 3000);
                        
                        document.head.appendChild(script);
                        
                    } catch (error) {
                        console.error('Error fetching Google suggestions:', error);
                        this.generateFallbackSuggestions(query);
                    }
                }
                
                generateFallbackSuggestions(query) {
                    // Basic fallback suggestions when Google API is not available
                    const fallbackSuggestions = [
                        `${query} tutorial`,
                        `${query} documentation`,
                        `${query} examples`,
                        `${query} guide`,
                        `how to ${query}`,
                        `${query} best practices`,
                        `learn ${query}`,
                        `${query} tips`
                    ].filter(suggestion => suggestion.toLowerCase() !== query.toLowerCase())
                     .slice(0, 5);
                    
                    this.renderHistory();
                    this.renderSuggestions(fallbackSuggestions, query);
                    this.updateSectionsVisibility();
                }
                
                async fetchBingSuggestions(query) {
                    try {
                        // Bing suggestion endpoint (simplified approach)
                        const suggestions = [
                            `${query} news`,
                            `${query} images`,
                            `${query} videos`,
                            `${query} definition`,
                            `${query} wiki`
                        ].filter(suggestion => suggestion.toLowerCase() !== query.toLowerCase())
                         .slice(0, 5);
                        
                        this.renderHistory();
                        this.renderSuggestions(suggestions, query);
                        this.updateSectionsVisibility();
                    } catch (error) {
                        console.error('Error fetching Bing suggestions:', error);
                        this.generateFallbackSuggestions(query);
                    }
                }
                
                async fetchDuckDuckGoSuggestions(query) {
                    try {
                        // DuckDuckGo focused suggestions
                        const suggestions = [
                            `${query} privacy`,
                            `${query} secure`,
                            `${query} anonymous`,
                            `${query} safe`,
                            `${query} private`
                        ].filter(suggestion => suggestion.toLowerCase() !== query.toLowerCase())
                         .slice(0, 5);
                        
                        this.renderHistory();
                        this.renderSuggestions(suggestions, query);
                        this.updateSectionsVisibility();
                    } catch (error) {
                        console.error('Error fetching DuckDuckGo suggestions:', error);
                        this.generateFallbackSuggestions(query);
                    }
                }
                
                async fetchYahooSuggestions(query) {
                    try {
                        // Yahoo themed suggestions
                        const suggestions = [
                            `${query} finance`,
                            `${query} sports`,
                            `${query} weather`,
                            `${query} news today`,
                            `${query} stock`
                        ].filter(suggestion => suggestion.toLowerCase() !== query.toLowerCase())
                         .slice(0, 5);
                        
                        this.renderHistory();
                        this.renderSuggestions(suggestions, query);
                        this.updateSectionsVisibility();
                    } catch (error) {
                        console.error('Error fetching Yahoo suggestions:', error);
                        this.generateFallbackSuggestions(query);
                    }
                }
                
                handleKeydown(e) {
                    if (!this.isVisible) return;
                    
                    const allItems = this.getCurrentItems();
                    
                    switch (e.key) {
                        case 'ArrowDown':
                            e.preventDefault();
                            this.currentHighlight = Math.min(this.currentHighlight + 1, allItems.length - 1);
                            this.updateHighlight();
                            break;
                            
                        case 'ArrowUp':
                            e.preventDefault();
                            this.currentHighlight = Math.max(this.currentHighlight - 1, -1);
                            this.updateHighlight();
                            break;
                            
                        case 'Enter':
                            e.preventDefault();
                            if (this.currentHighlight >= 0 && allItems[this.currentHighlight]) {
                                this.selectSuggestion(allItems[this.currentHighlight].textContent);
                            } else {
                                this.performSearchAction(this.searchInput.value);
                            }
                            break;
                            
                        case 'Tab':
                            if (this.currentHighlight >= 0 && allItems[this.currentHighlight]) {
                                e.preventDefault();
                                this.searchInput.value = allItems[this.currentHighlight].textContent;
                                this.searchInput.setSelectionRange(this.searchInput.value.length, this.searchInput.value.length);
                            }
                            break;
                    }
                }
                
                getCurrentItems() {
                    return Array.from(this.suggestionsContainer.querySelectorAll('.suggestion-item'));
                }
                
                updateHighlight() {
                    const items = this.getCurrentItems();
                    
                    items.forEach((item, index) => {
                        if (index === this.currentHighlight) {
                            item.classList.add('highlighted');
                            item.scrollIntoView({ block: 'nearest' });
                        } else {
                            item.classList.remove('highlighted');
                        }
                    });
                }
                
                showOnlyHistory() {
                    this.renderHistory();
                    
                    // If no history, show popular searches
                    if (this.searchHistory.length === 0) {
                        this.renderPopularSearches();
                    } else {
                        this.renderSuggestions([], '');
                    }
                    
                    this.updateSectionsVisibility();
                }
                
                renderHistory() {
                    if (this.searchHistory.length === 0) {
                        this.historyItems.innerHTML = '';
                        return;
                    }
                    
                    const recentHistory = this.searchHistory.slice(0, 5);
                    this.historyItems.innerHTML = recentHistory
                        .map(item => this.createSuggestionHTML(item.query, 'history', item.timestamp))
                        .join('');
                    
                    // Add click listeners
                    this.historyItems.querySelectorAll('.suggestion-item').forEach(item => {
                        item.addEventListener('click', () => {
                            this.selectSuggestion(item.querySelector('.suggestion-text').textContent);
                        });
                        
                        // Handle remove button
                        const removeBtn = item.querySelector('.suggestion-remove');
                        if (removeBtn) {
                            removeBtn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                e.preventDefault();
                                
                                // Store the query to remove
                                const queryToRemove = item.querySelector('.suggestion-text').textContent;
                                
                                // Remove the item immediately from DOM to prevent blur
                                item.style.display = 'none';
                                
                                // Keep suggestions visible by preventing blur
                                this.searchInput.focus();
                                
                                // Remove from history and re-render
                                this.removeHistoryItem(queryToRemove);
                                
                                return false;
                            });
                            
                            // Prevent mousedown from triggering blur
                            removeBtn.addEventListener('mousedown', (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                            });
                        }
                    });
                }
                
                renderPopularSearches() {
                    // Get 5 random popular searches
                    const shuffled = [...this.popularSearches].sort(() => 0.5 - Math.random());
                    const selectedPopular = shuffled.slice(0, 5);
                    
                    this.suggestionItems.innerHTML = selectedPopular
                        .map(item => this.createSuggestionHTML(item, 'popular'))
                        .join('');
                    
                    // Add click listeners
                    this.suggestionItems.querySelectorAll('.suggestion-item').forEach(item => {
                        item.addEventListener('click', () => {
                            this.selectSuggestion(item.querySelector('.suggestion-text').textContent);
                        });
                    });
                }
                
                renderSuggestions(suggestions, query) {
                    if (suggestions.length === 0) {
                        this.suggestionItems.innerHTML = '';
                        return;
                    }
                    
                    this.suggestionItems.innerHTML = suggestions
                        .map(suggestion => this.createSuggestionHTML(suggestion, 'suggestion', null, query))
                        .join('');
                    
                    // Add click listeners
                    this.suggestionItems.querySelectorAll('.suggestion-item').forEach(item => {
                        item.addEventListener('click', () => {
                            this.selectSuggestion(item.querySelector('.suggestion-text').textContent);
                        });
                    });
                }
                
                createSuggestionHTML(text, type, timestamp = null, query = '') {
                    let icon;
                    switch (type) {
                        case 'history':
                            icon = 'fas fa-history';
                            break;
                        case 'popular':
                            icon = 'fas fa-fire'; // Trending icon for popular searches
                            break;
                        default:
                            icon = 'fas fa-search';
                    }
                    
                    const highlightedText = query ? this.highlightText(text, query) : text;
                    const removeButton = type === 'history' ? '<i class="fas fa-times suggestion-remove" title="Remove from history"></i>' : '';
                    
                    return `
                        <div class="suggestion-item" data-type="${type}">
                            <div class="suggestion-icon">
                                <i class="${icon}"></i>
                            </div>
                            <div class="suggestion-text">${highlightedText}</div>
                            ${removeButton}
                        </div>
                    `;
                }
                
                highlightText(text, query) {
                    if (!query) return text;
                    
                    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    return text.replace(regex, '<span class="highlight">$1</span>');
                }
                
                updateSectionsVisibility() {
                    const hasHistory = this.searchHistory.length > 0;
                    const hasSuggestions = this.suggestionItems.innerHTML.trim() !== '';
                    
                    this.historySection.style.display = hasHistory ? 'block' : 'none';
                    this.suggestionsSection.style.display = hasSuggestions ? 'block' : 'none';
                    this.clearHistorySection.style.display = hasHistory ? 'block' : 'none';
                }
                
                showSuggestions() {
                    this.isVisible = true;
                    this.suggestionsContainer.classList.add('show');
                    this.searchInput.classList.add('suggestions-active'); // Fallback for :has() support
                    
                    if (this.searchInput.value.trim()) {
                        this.generateSuggestions(this.searchInput.value);
                    } else {
                        this.showOnlyHistory();
                    }
                }
                
                hideSuggestions() {
                    this.isVisible = false;
                    this.suggestionsContainer.classList.remove('show');
                    this.searchInput.classList.remove('suggestions-active'); // Remove fallback class
                    this.currentHighlight = -1;
                }
                
                selectSuggestion(text) {
                    this.searchInput.value = text;
                    this.performSearchAction(text);
                }
                
                async performSearchAction(query) {
                    if (!query.trim()) return;
                    
                    this.addToHistory(query);
                    this.hideSuggestions();
                    
                    // Perform the actual search using global performSearch function
                    await performSearch(query);
                }
                
                addToHistory(query) {
                    const cleanQuery = query.trim();
                    if (!cleanQuery) return;
                    
                    // Remove if already exists
                    this.searchHistory = this.searchHistory.filter(item => 
                        item.query.toLowerCase() !== cleanQuery.toLowerCase()
                    );
                    
                    // Add to beginning
                    this.searchHistory.unshift({
                        query: cleanQuery,
                        timestamp: Date.now()
                    });
                    
                    // Limit to 50 items
                    this.searchHistory = this.searchHistory.slice(0, 50);
                    
                    this.saveSearchHistory();
                }
                
                removeHistoryItem(query) {
                    // Remove from history array
                    this.searchHistory = this.searchHistory.filter(item => 
                        item.query !== query
                    );
                    this.saveSearchHistory();
                    
                    // Force dropdown to stay open
                    const wasVisible = this.isVisible;
                    
                    // Re-render content
                    if (this.searchInput.value.trim()) {
                        // If user is typing, fetch new suggestions
                        this.fetchGoogleSuggestions(this.searchInput.value);
                    } else {
                        // If no input, show history or popular searches
                        this.showOnlyHistory();
                    }
                    
                    // Force dropdown to stay visible
                    if (wasVisible) {
                        setTimeout(() => {
                            this.isVisible = true;
                            this.suggestionsContainer.classList.add('show');
                            this.searchInput.classList.add('suggestions-active');
                        }, 0);
                    }
                }
                
                clearAllHistory() {
                    this.searchHistory = [];
                    this.saveSearchHistory();
                    
                    // Show popular searches since history is now empty
                    this.showOnlyHistory();
                    
                    // Keep dropdown visible
                    if (!this.isVisible) {
                        this.showSuggestions();
                    }
                    
                    // Keep input focused
                    setTimeout(() => {
                        this.searchInput.focus();
                    }, 10);
                }
                
                loadSearchHistory() {
                    try {
                        const history = localStorage.getItem('rushBrowserSearchHistory');
                        return history ? JSON.parse(history) : [];
                    } catch (e) {
                        console.error('Failed to load search history:', e);
                        return [];
                    }
                }
                
                saveSearchHistory() {
                    try {
                        localStorage.setItem('rushBrowserSearchHistory', JSON.stringify(this.searchHistory));
                    } catch (e) {
                        console.error('Failed to save search history:', e);
                    }
                }
                
                // Clear all search history (called from main process)
                clearAllHistory() {
                    try {
                        this.searchHistory = [];
                        this.saveSearchHistory();
                        // Update UI
                        this.renderHistory();
                        this.updateSectionsVisibility();
                        console.log('Search history cleared');
                        return true;
                    } catch (error) {
                        console.error('Error clearing search history:', error);
                        return false;
                    }
                }
                
                // Alternative method name for compatibility
                clearSearchHistory() {
                    return this.clearAllHistory();
                }
            }
            
            // Global functions for UI interactions
            function clearSearchHistory() {
                if (window.searchManager) {
                    window.searchManager.clearAllHistory();
                }
            }
            
            // Initialize search manager and enhanced search functionality when DOM is loaded
            document.addEventListener('DOMContentLoaded', () => {
                window.searchManager = new SearchSuggestionManager();
                
                // Enhanced search input functionality
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener("keypress", async function (e) {
                    if (e.key === "Enter") {
                        const query = this.value.trim();
                        if (query) {
                            if (window.searchManager) {
                                await window.searchManager.performSearchAction(query);
                            } else {
                                // Fallback if search manager is not available
                                await performSearch(query);
                            }
                        }
                    }
                });
                
                // Global function for clearing search data (called from main process)
                window.clearSearchData = function() {
                    try {
                        // Clear search history from SearchSuggestionManager
                        if (window.searchManager) {
                            window.searchManager.clearSearchHistory();
                        }
                        
                        // Clear localStorage
                        localStorage.removeItem('searchHistory');
                        localStorage.removeItem('browser-settings');
                        localStorage.clear();
                        
                        // Clear sessionStorage
                        sessionStorage.clear();
                        
                        console.log('Search data cleared successfully');
                        return true;
                    } catch (error) {
                        console.error('Error clearing search data:', error);
                        return false;
                    }
                };
            });
        </script>
    </body>
